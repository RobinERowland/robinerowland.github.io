name: Update website from Excel files

on:
  push:
    paths:
      - 'source-data/**.xlsx'
      - 'scripts/**.R'
      - 'cv/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system libraries for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::stringr
            any::purrr
            any::readr
            any::rmarkdown

      - name: Update website pages from Excel
        run: Rscript scripts/update_site.R

      - name: Render CV PDF
        run: Rscript scripts/render_cv.R

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data _pages cv/generated files/Rowland_CV_2026.pdf
          git diff --cached --quiet || git commit -m "Automatically update website and CV"
          git push
